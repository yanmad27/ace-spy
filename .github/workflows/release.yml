name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet Windows client
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./build-client.sh "$version"
          cd dist
          zip -9 "ace-spy-${version}-windows-amd64.zip" ace-spy.exe ace-spy.exe.manifest
          sha256sum "ace-spy-${version}-windows-amd64.zip" > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/ace-spy-${version}-windows-amd64.zip" dist/SHA256SUMS.txt \
            --title "ace-spy $GITHUB_REF_NAME" --generate-notes --verify-tag
