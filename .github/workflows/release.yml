name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Tesseract
        run: choco install tesseract -y --no-progress

      - name: Build
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./build-client.sh "$version"
          ./scripts/bundle-tesseract.sh

      - name: Test (Windows OCR, bundled Tesseract)
        env:
          TESS_TEST_APPDIR: ${{ github.workspace }}/dist
        run: go test -count=1 -v ./internal/tesseract ./internal/winocr ./internal/gamewin ./internal/chatparse ./internal/chatdiff ./internal/runner ./internal/pusher

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          zip="ace-spy-${version}-windows-amd64.zip"
          (cd dist && 7z a -tzip -mx=9 "$zip" ace-spy.exe ace-spy.exe.manifest tesseract tessdata >/dev/null && sha256sum "$zip" > SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/ace-spy-${version}-windows-amd64.zip" dist/SHA256SUMS.txt \
            --title "ace-spy $GITHUB_REF_NAME" --generate-notes --verify-tag
