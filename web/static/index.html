<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SFA Spy</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="logo" aria-label="SFA Spy"><span class="logo-text" aria-hidden="true">SFA SPY</span><svg class="logo-jet" viewBox="0 0 32 32" aria-hidden="true"><path d="M27 6 L19 10 L11 9 L9 10.5 L16 13 L12 18 L8.5 18 L7.5 19.5 L12.5 20.5 L13.5 25.5 L15 24.5 L15 21 L20 17 L22.5 24 L24 22 L23 14 Z"/></svg></h1>
    <span id="status" class="status">đang kết nối…</span>
    <span id="viewers" class="viewers" title="Số người đang xem" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg><span class="n">0</span><span class="sr">người đang xem</span></span>
    <input id="search" type="search" placeholder="Lọc nội dung…" autocomplete="off">
    <label class="toggle"><input id="single" type="checkbox"> 1 khung</label>
    <label class="toggle"><input id="autoscroll" type="checkbox" checked> Tự cuộn</label>
  </header>
  <div class="panes">
    <section class="pane" data-pane="0">
      <div class="pane-head"><select aria-label="Vùng chat khung trái"></select><span class="count"></span></div>
      <div class="scroll"><button class="older" type="button" hidden>Tải cũ hơn</button><ol class="feed"></ol></div>
    </section>
    <section class="pane" data-pane="1">
      <div class="pane-head"><select aria-label="Vùng chat khung phải"></select><span class="count"></span></div>
      <div class="scroll"><button class="older" type="button" hidden>Tải cũ hơn</button><ol class="feed"></ol></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
