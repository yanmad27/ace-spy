<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SFA Spy</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SFA Spy</h1>
    <span id="status" class="status">đang kết nối…</span>
    <input id="search" type="search" placeholder="Lọc nội dung…" autocomplete="off">
    <label class="toggle"><input id="single" type="checkbox"> 1 khung</label>
    <label class="toggle"><input id="autoscroll" type="checkbox" checked> Tự cuộn</label>
  </header>
  <div class="panes">
    <section class="pane" data-pane="0">
      <div class="pane-head"><select aria-label="Vùng chat khung trái"></select><span class="count"></span></div>
      <div class="scroll"><button class="older" type="button" hidden>Tải cũ hơn</button><ol class="feed"></ol></div>
    </section>
    <section class="pane" data-pane="1">
      <div class="pane-head"><select aria-label="Vùng chat khung phải"></select><span class="count"></span></div>
      <div class="scroll"><button class="older" type="button" hidden>Tải cũ hơn</button><ol class="feed"></ol></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
